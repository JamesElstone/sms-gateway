<VirtualHost *:80>
    ServerName hydrogen.int.elstone.net

    DocumentRoot "/usr/local/www/sms-gateway/public"
    DirectoryIndex index.php

    <Directory "/usr/local/www/sms-gateway/public">
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^/sms-gateway/ /index.php [QSA,L]
</VirtualHost>
