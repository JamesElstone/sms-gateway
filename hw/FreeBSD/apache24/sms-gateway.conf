# SMS Gateway Apache 2.4 include for FreeBSD.
#
# Install as:
#   /usr/local/etc/apache24/Includes/sms-gateway.conf
#
# This mounts the local PHP API into the existing/default website at:
#   /sms-gateway/send/{mobile-number}
#
# It also exposes the USB LTE dongle web UI through Hydrogen at:
#   /lte-device/
# reverse-proxied from:
#   http://192.168.8.1/
#
# The FreeBSD apache24 package normally includes:
#   IncludeOptional etc/apache24/Includes/*.conf
# from the main httpd.conf, so no httpd.conf edit is required.
#
# Hydrogen already has mod_rewrite available. Do not LoadModule it here; doing
# so causes AH01574 "module rewrite_module is already loaded" warnings.

<IfModule !proxy_module>
    LoadModule proxy_module libexec/apache24/mod_proxy.so
</IfModule>
<IfModule !alias_module>
    LoadModule alias_module libexec/apache24/mod_alias.so
</IfModule>
<IfModule !dir_module>
    LoadModule dir_module libexec/apache24/mod_dir.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module libexec/apache24/mod_proxy_http.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module libexec/apache24/mod_headers.so
</IfModule>
<IfModule !setenvif_module>
    LoadModule setenvif_module libexec/apache24/mod_setenvif.so
</IfModule>

ProxyRequests Off
ProxyPreserveHost Off

Alias "/sms-gateway" "/usr/local/sms-gateway/public"

<Directory "/usr/local/sms-gateway/public">
    Require all granted
    AllowOverride None
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php
    FallbackResource /sms-gateway/index.php
</Directory>

RedirectMatch 308 ^/lte-device$ /lte-device/

ProxyPass "/lte-device/" "http://192.168.8.1/" nocanon
ProxyPassReverse "/lte-device/" "http://192.168.8.1/"
ProxyPassReverseCookiePath "/" "/lte-device/"

<Location "/lte-device/">
    Require all granted
    Header edit Location "^/$" "/lte-device/"
    Header edit Location "^/(api|html|js|css|lib|res|lang|webui|index\.html|favicon\.ico)(/.*)?$" "/lte-device/$1$2"
</Location>

# Some HiLink-style dongle UIs make root-relative requests such as /api/... or
# /html/... even when browsed below /lte-device/. Proxy those common device paths
# only when the request came from the /lte-device/ UI, so Hydrogen's default site
# keeps ownership of those paths for normal traffic.
SetEnvIfNoCase Referer "^https?://[^/]+/lte-device/" lte_device_ui=1
Header edit Location "^/$" "/lte-device/" env=lte_device_ui
Header edit Location "^/(api|html|js|css|lib|res|lang|webui|index\.html|favicon\.ico)(/.*)?$" "/lte-device/$1$2" env=lte_device_ui
RewriteEngine On
RewriteCond %{HTTP_REFERER} ^https?://[^/]+/lte-device/ [NC]
RewriteRule ^/(api|html|js|css|lib|res|lang|webui|favicon\.ico)(/.*)?$ http://192.168.8.1/$1$2 [P,L,NE]
